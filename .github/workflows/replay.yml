name: Candidate replay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        optimize: ['', '-O']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependency
        run: python -m pip install -r requirements.txt
      - name: Verify manifest and candidate metadata
        run: |
          python ${{ matrix.optimize }} scripts/verify_manifest.py --root "$PWD"
          python ${{ matrix.optimize }} scripts/validate_candidate.py --root "$PWD"
      - name: Replay Jacobian checks
        run: >-
          python ${{ matrix.optimize }} scripts/verify_jacobian_refactor.py
          --witness-data evidence/upstream/polydegree_e3_witnesses_50_100.json
      - name: Run mutation and regression controls
        run: >-
          python ${{ matrix.optimize }} scripts/test_mutations.py
          --witness-data evidence/upstream/polydegree_e3_witnesses_50_100.json
